name: CI

on:
  push:
    branches: [main]
  # 💡 Dijalankan otomatis saat kamu buat Pull Request ke branch main
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackpocket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26' 

      - name: Install dependencies
        run: go mod download

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Menjalankan migration secara urut untuk database testing
      - name: Apply migrations to test database
        run: |
          sudo apt-get install -y postgresql-client
          for file in migration/*.up.sql; do
            echo "Applying $file..."
            psql postgresql://postgres:postgres@localhost:5432/trackpocket_test -f "$file"
          done

      # Menjalankan seluruh unit & integration test
      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trackpocket_test?sslmode=disable
          JWT_SECRET: secret_key_ci_test
        run: go test ./tests/... -v

      # Memastikan tidak ada error kompilasi di seluruh package
      - name: Build
        run: go build ./...